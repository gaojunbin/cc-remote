# cc-remote Relay container.
#
# The official deploy is a systemd venv + managed Caddy (see deploy/README.md).
# This compose file runs the same relay inside a container for isolated,
# memory-bounded VPSes, or for any host that already terminates TLS itself.
#
# Configure the public domain and HTTPS only in Nginx Proxy Manager (or another
# reverse proxy). Forward HTTP to the Docker host's published port, preserve
# Host, and enable WebSocket support. PUBLIC_ORIGIN=auto in the image requires
# HTTPS browser access and checks Origin against Host without trusting
# caller-supplied forwarding headers. Restrict the published port to your proxy.
#
# Usage (from this deploy/ directory):
#   cp env.relay.docker.example env.relay   # then fill in the secrets
#   docker compose up -d --build
#   curl http://127.0.0.1:8765/healthz       # -> {"ok":true,...}
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cc-remote-relay:latest
    container_name: cc-remote-relay
    restart: unless-stopped
    # HOST_PORT:CONTAINER_PORT. Change the left side to suit your host.
    # NPM in another container must use the Docker host's reachable address,
    # not 127.0.0.1 (which would refer to NPM's own container).
    ports:
      - "8765:8765"
    env_file:
      - env.relay
    volumes:
      # Persistent device registry + Web Push/APNs databases. The named
      # volume inherits /app/state ownership from the image (the ccremote
      # user), so no host-side chown is needed.
      - relay-state:/app/state
      # Optional APNs key. Set APNS_KEY_PATH=/run/secrets/apns/AuthKey.p8
      # and make this file readable by container UID 10001 before enabling.
      # - /opt/cc-remote/secrets/AuthKey.p8:/run/secrets/apns/AuthKey.p8:ro
    read_only: true
    tmpfs:
      - /tmp

volumes:
  relay-state:
